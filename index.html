<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SQANDAL — на домашний экран</title>
  <meta name="description" content="Как добавить SQANDAL.net на главный экран iPhone и Android." />
  <meta name="theme-color" content="#070707" />
  <link rel="icon" href="https://sqandal.net/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070707; --fg: #fafafa; --surface: #121212; --muted: #8f8f8f;
      --primary: #f51d31; --primary-fg: #fafafa; --border: #262626; --popover: #0d0d0d;
      --font: Inter, system-ui, sans-serif;
      --display: "Bebas Neue", Inter, sans-serif;
      --grotesk: "Space Grotesk", Inter, sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); }
    html { overflow-x: hidden; overflow-y: auto; }
    button { font: inherit; cursor: pointer; touch-action: manipulation; }
    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    .wrap { max-width: 64rem; margin: 0 auto; padding: 1rem 0.75rem 5rem; }
    @media (min-width: 640px) { .wrap { padding: 1.5rem 1.5rem 2.5rem; } }
    .banner { margin-bottom: 0.75rem; background: var(--surface); padding: 0.65rem 0.75rem; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--primary); font-size: 0.875rem; }
    .hidden { display: none !important; }
    .tag { margin-top: 2px; font-family: var(--grotesk); font-size: 0.625rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--muted); }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); padding: 4px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--border); }
    .tabs button { height: 2.75rem; border: 0; border-radius: 4px; background: transparent; font-family: var(--grotesk); font-size: 0.75rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
    .tabs button.on { background: var(--primary); color: #fff; }
    .cheat { margin: 0.75rem 0 0; text-align: center; font-family: var(--grotesk); font-size: 0.625rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
    .cheat b { color: var(--fg); font-weight: 500; }
    .cheat .a { margin: 0 0.4rem; color: var(--primary); }
    .stage { margin-top: 1rem; display: flex; flex-direction: column; align-items: center; }
    .phone { width: min(16.25rem, 72vw, 36dvh); }
    @media (min-width: 640px) { .phone { width: min(18.75rem, 42vw, 52dvh); } }
    .bezel { padding: 6px; border-radius: 36px; background: var(--popover); box-shadow: 0 24px 64px -12px rgb(0 0 0 / 0.65), inset 0 0 0 1px var(--border); }
    .screen { position: relative; overflow: hidden; border-radius: 28px; background: var(--bg); aspect-ratio: 390/760; }
    .notch { position: absolute; inset: 0 0 auto; z-index: 5; display: flex; justify-content: center; padding-top: 6px; pointer-events: none; }
    .notch span { width: 5rem; height: 1rem; border-radius: 999px; background: var(--bg); }
    .scene { display: flex; flex-direction: column; height: 100%; }
    .site { padding: 2rem 0.75rem 0; }
    .site-h { display: flex; align-items: center; gap: 0.5rem; }
    .site-h img { width: 2rem; height: 2rem; }
    .site-h strong { font-family: var(--display); font-size: 1.125rem; font-weight: 400; letter-spacing: 0.04em; }
    .kicker { margin-top: 0.75rem; display: flex; align-items: center; gap: 6px; font-family: var(--grotesk); font-size: 0.5625rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--primary); }
    .kicker i { width: 4px; height: 4px; background: var(--primary); }
    .h1 { margin-top: 6px; font-family: var(--display); font-size: 1.25rem; letter-spacing: 0.04em; line-height: 1; }
    .card { margin-top: 0.75rem; box-shadow: inset 0 0 0 1px var(--border); }
    .card-img { aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; background: var(--surface); }
    .card-img img { width: 2.5rem; opacity: 0.8; }
    .card-cap { border-top: 1px solid var(--border); padding: 6px 8px; }
    .card-cap strong { font-family: var(--display); font-size: 0.875rem; font-weight: 400; }
    .card-cap span { font-family: var(--grotesk); font-size: 0.5625rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
    .sbar { margin-top: auto; display: flex; align-items: center; gap: 6px; padding: 8px 8px 12px; }
    .p { width: 2rem; height: 2rem; border-radius: 999px; background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 0.65rem; flex: 0 0 auto; }
    .p.on { background: color-mix(in srgb, var(--primary) 15%, transparent); color: var(--primary); box-shadow: 0 0 0 2px var(--primary); animation: pulse 1.6s ease-out infinite; }
    .urlp { flex: 1; height: 2rem; border-radius: 999px; background: var(--surface); display: flex; align-items: center; justify-content: center; font-family: var(--grotesk); font-size: 0.625rem; box-shadow: inset 0 0 0 1px var(--border); }
    @keyframes pulse { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--primary) 28%, transparent); } }
    @media (prefers-reduced-motion: reduce) { .p.on { animation: none; } }
    .pop { position: absolute; right: 8px; bottom: 8px; z-index: 3; width: 70%; background: var(--surface); border-radius: 12px; padding: 10px; box-shadow: inset 0 0 0 1px var(--border); }
    .hit { background: var(--primary); color: #fff; border-radius: 4px; padding: 8px; font-family: var(--grotesk); font-size: 0.625rem; display: flex; align-items: center; gap: 6px; }
    .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; background: color-mix(in srgb, var(--surface) 95%, transparent); padding: 12px; box-shadow: inset 0 0 0 1px var(--border); }
    .icons { display: flex; justify-content: space-around; margin-bottom: 8px; }
    .icons span { width: 2.25rem; height: 2.25rem; border-radius: 999px; background: var(--border); }
    .icons .w { background: var(--fg); color: var(--bg); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px var(--primary); }
    .rowhit { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 3; display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 8px; background: var(--surface); box-shadow: 0 0 0 2px var(--primary); font-family: var(--grotesk); font-size: 0.625rem; }
    .home { padding: 2.5rem 1rem 0; height: 100%; }
    .apps { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem 0.75rem; }
    .app { display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: var(--grotesk); font-size: 0.5625rem; color: var(--muted); }
    .app .ic { width: 2.75rem; height: 2.75rem; border-radius: 12px; background: var(--surface); display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 1px var(--border); }
    .app.on { color: var(--fg); }
    .app.on .ic { box-shadow: inset 0 0 0 2px var(--primary); }
    .app img { width: 2.25rem; height: 2.25rem; }
    .dot { width: 12px; height: 12px; border-radius: 2px; background: var(--border); }
    .menu { position: absolute; right: 8px; top: 8px; z-index: 3; width: 72%; overflow: hidden; border-radius: 8px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); font-family: var(--grotesk); font-size: 0.625rem; }
    .menu div { padding: 6px 10px; }
    .menu .on { background: var(--primary); color: #fff; }
    .dim { position: absolute; inset: 0; z-index: 4; display: flex; align-items: flex-end; justify-content: center; background: rgb(7 7 7 / 0.7); padding: 0 12px 40px; }
    .dlg { width: 100%; background: var(--surface); border-radius: 12px; padding: 12px; box-shadow: inset 0 0 0 1px var(--border); }
    .dlg .l { font-family: var(--grotesk); font-size: 0.625rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
    .dlg .b { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-family: var(--display); font-size: 1.125rem; }
    .add { margin-top: 12px; display: flex; justify-content: flex-end; }
    .add span { background: var(--primary); color: #fff; border-radius: 4px; padding: 4px 10px; font-family: var(--grotesk); font-size: 0.625rem; letter-spacing: 0.22em; text-transform: uppercase; }
    .chrome { display: flex; align-items: center; justify-content: space-between; padding: 2rem 0.75rem 6px; font-family: var(--grotesk); font-size: 0.5625rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
    .url { margin: 0 0.75rem 8px; height: 1.75rem; border-radius: 999px; background: var(--surface); display: flex; align-items: center; padding: 0 10px; font-family: var(--grotesk); font-size: 0.625rem; box-shadow: inset 0 0 0 1px var(--border); }
    .controls { margin-top: 1rem; display: flex; align-items: center; justify-content: center; gap: 1.25rem; }
    .arrow { position: relative; z-index: 50; width: 3rem; height: 3rem; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--fg); display: flex; align-items: center; justify-content: center; }
    .arrow:active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .count { min-width: 4rem; text-align: center; font-family: var(--grotesk); font-size: 0.75rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
    .plat { margin: 0.5rem 0 0; font-family: var(--grotesk); font-size: 0.625rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
    .cap { margin-top: 1rem; max-width: 36rem; width: 100%; text-align: center; }
    .cap h1 { margin: 0; font-family: var(--display); font-size: 1.5rem; font-weight: 400; letter-spacing: 0.04em; }
    .cap p { margin: 0.5rem 0 0; font-size: 0.875rem; line-height: 1.5; color: var(--muted); }
    .steps { max-width: 36rem; width: 100%; margin: 2rem auto 0; padding: 0; list-style: none; display: grid; gap: 0.5rem; }
    .steps button { width: 100%; display: flex; gap: 1rem; text-align: left; padding: 1rem; border-radius: 12px; border: 0; background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1px var(--border); }
    .steps button.on { background: var(--surface); box-shadow: inset 0 0 0 1px var(--primary); }
    .num { flex: 0 0 2rem; width: 2rem; height: 2rem; display: flex; align-items: center; justify-content: center; border-radius: 4px; background: var(--surface); color: var(--muted); font-family: var(--display); font-size: 1.125rem; }
    .steps button.on .num { background: var(--primary); color: #fff; }
    .steps strong { display: block; font-family: var(--display); font-size: 1.25rem; font-weight: 400; }
    .steps em { display: block; margin-top: 4px; font-style: normal; font-size: 0.875rem; color: var(--muted); line-height: 1.45; }
    .qr { display: none; margin-top: 2rem; align-items: center; justify-content: center; gap: 1rem; }
    @media (min-width: 640px) { .qr { display: flex; } }
    .qr img { width: 4rem; height: 4rem; background: #fff; padding: 4px; border-radius: 4px; }
    .qr p { max-width: 20rem; margin: 0; font-size: 0.875rem; color: var(--muted); }
    footer { display: none; border-top: 1px solid var(--border); }
    @media (min-width: 640px) { footer { display: block; } }
    .foot { max-width: 64rem; margin: 0 auto; padding: 1.25rem 1.5rem; display: flex; justify-content: space-between; font-family: var(--grotesk); font-size: 0.625rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
    .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; pointer-events: none; padding: 0.5rem 0.75rem max(0.5rem, env(safe-area-inset-bottom)); }
    @media (min-width: 640px) { .dock { display: none; } }
    .dock a { pointer-events: auto; display: flex; align-items: center; justify-content: center; margin: 0 auto; height: 2.25rem; width: fit-content; padding: 0 0.85rem; border-radius: 8px; background: var(--primary); color: #fff; font-family: var(--grotesk); font-size: 0.625rem; letter-spacing: 0.18em; text-transform: uppercase; }
  </style>
</head>
<body>
  <main class="wrap">
    <div id="inapp" class="banner hidden">Откройте в Safari или Chrome: меню → «Открыть в браузере».</div>
    <div class="tabs">
      <button type="button" id="tab-ios" class="on">iPhone / iPad</button>
      <button type="button" id="tab-android">Android</button>
    </div>
    <p class="cheat" id="cheat"></p>
    <section class="stage">
      <div class="phone" id="phone"></div>
      <div class="controls">
        <button type="button" class="arrow" id="prev" aria-label="Назад"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
        <p class="count" id="count">1 / 5</p>
        <button type="button" class="arrow" id="next" aria-label="Дальше"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
      </div>
      <p class="plat" id="plat">iPhone · Safari</p>
      <div class="cap"><h1 id="title"></h1><p id="body"></p></div>
    </section>
    <ol class="steps" id="list"></ol>
    <div class="qr">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=https%3A%2F%2Fsqandal.net" width="72" height="72" alt="QR" />
      <p>С компьютера — наведите камеру на код и откройте sqandal.net на телефоне.</p>
    </div>
  </main>
  <footer><div class="foot"><p>sqandal.net · хип-хоп комьюнити</p><a href="https://sqandal.net">Перейти на сайт →</a></div></footer>
  <div class="dock"><a href="https://sqandal.net" target="_blank" rel="noopener">Открыть sqandal.net</a></div>
  <script>
    const LOGO = "https://sqandal.net/__l5e/assets-v1/d9ab782b-6d6b-4dc8-85d9-64a0627492a5/sqandal-q-logo.png";
    const IOS = [
      { title: "Зайдите в Safari на sqandal.net", body: "Нажмите кнопку меню справа от адреса." },
      { title: "Выберите «Поделиться»", body: "Пункт в меню с квадратом и стрелкой вверх." },
      { title: "Нажмите «Показать больше»", body: "Белая кнопка со стрелкой вниз в конце ряда иконок." },
      { title: "На экран «Домой»", body: "Нажмите «Добавить на экран «Домой»." },
      { title: "Нажмите «Добавить»", body: "Иконка SQANDAL появится на главном экране." }
    ];
    const AND = [
      { title: "Зайдите в Chrome на sqandal.net", body: "Нажмите кнопку меню в правом верхнем углу." },
      { title: "Добавить на главный экран", body: "Выберите этот пункт в меню." },
      { title: "Нажмите «Добавить»", body: "Подтвердите ярлык SQANDAL." },
      { title: "Готово", body: "Иконка SQANDAL на рабочем столе. Открывается в один тап." }
    ];
    const ua = navigator.userAgent || "";
    let platform = /Android/i.test(ua) ? "android" : "ios";
    let step = 0;
    const $ = (id) => document.getElementById(id);
    const steps = () => platform === "ios" ? IOS : AND;

    function site() {
      return `<div class="site">
        <div class="site-h"><img src="${LOGO}" alt=""/><div><strong>SQANDAL</strong><div class="tag">Hip-Hop Community</div></div></div>
        <div class="kicker"><i></i> scandals</div>
        <div class="h1">Эксклюзивы.<br>Релизы. Культура.</div>
        <div class="card"><div class="card-img"><img src="${LOGO}" alt=""/></div><div class="card-cap"><strong>Главный материал</strong><span>Читать →</span></div></div>
      </div>`;
    }
    function sbar(on) {
      return `<div class="sbar">
        <span class="p"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
        <span class="p"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="5" y="7" width="10" height="12" rx="1.5" stroke="currentColor" stroke-width="1.6"/></svg></span>
        <span class="urlp">sqandal.net</span>
        <span class="p${on ? " on" : ""}"><svg width="14" height="14" viewBox="0 0 16 16"><circle cx="3" cy="8" r="1.4" fill="currentColor"/><circle cx="8" cy="8" r="1.4" fill="currentColor"/><circle cx="13" cy="8" r="1.4" fill="currentColor"/></svg></span>
      </div>`;
    }
    function home() {
      const apps = ["Музыка","Фото","Почта","Чаты","SQANDAL","Новости"];
      return `<div class="home"><div class="apps">${apps.map(n => {
        const sq = n === "SQANDAL";
        return `<div class="app${sq?" on":""}"><div class="ic">${sq?`<img src="${LOGO}" alt=""/>`:`<span class="dot"></span>`}</div>${n}</div>`;
      }).join("")}</div></div>`;
    }
    function ios(s) {
      if (s >= 4) return home();
      let extra = "";
      if (s === 1) extra = `<div class="pop"><div class="hit"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 16V4M8 8l4-4 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> Поделиться</div></div>`;
      if (s === 2) extra = `<div class="sheet"><div class="icons"><span></span><span></span><span></span><span class="w"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></span></div><div style="text-align:center;font-family:var(--grotesk);font-size:.5625rem">Показать больше</div></div>`;
      if (s === 3) extra = `<div class="rowhit"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 2.5v7M2.5 6h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg> Добавить на экран «Домой»</div>`;
      return `<div class="scene"><div style="position:relative;flex:1;min-height:0">${site()}${extra}</div>${sbar(s===0||s===1)}</div>`;
    }
    function android(s) {
      if (s >= 3) return home();
      let extra = "";
      if (s === 1) extra = `<div class="menu"><div>Новая вкладка</div><div class="on">Добавить на главный экран</div><div>Настройки</div></div>`;
      if (s === 2) extra = `<div class="dim"><div class="dlg"><div class="l">На главный экран</div><div class="b"><img src="${LOGO}" width="32" height="32" alt=""/>SQANDAL</div><div class="add"><span>Добавить</span></div></div></div>`;
      return `<div class="scene">
        <div class="chrome"><span>Chrome</span><span class="p${s===0||s===1?" on":""}"><svg width="14" height="14" viewBox="0 0 16 16"><circle cx="8" cy="2.5" r="1.4" fill="currentColor"/><circle cx="8" cy="8" r="1.4" fill="currentColor"/><circle cx="8" cy="13.5" r="1.4" fill="currentColor"/></svg></span></div>
        <div class="url">sqandal.net</div>
        <div style="position:relative;flex:1;min-height:0">${site()}${extra}</div>
      </div>`;
    }
    function render() {
      const list = steps();
      const cur = list[step];
      $("phone").innerHTML = `<div class="bezel"><div class="screen"><div class="notch"><span></span></div>${platform==="ios"?ios(step):android(step)}</div></div>`;
      $("count").textContent = (step+1)+" / "+list.length;
      $("plat").textContent = platform==="ios" ? "iPhone · Safari" : "Android · Chrome";
      $("title").textContent = cur.title;
      $("body").textContent = cur.body;
      $("cheat").innerHTML = (platform==="ios"?["Safari","меню","Поделиться","На экран «Домой»"]:["Chrome","меню","На главный экран","Добавить"]).map((t,i)=>(i?'<span class="a">→</span>':'')+'<b>'+t+'</b>').join("");
      $("tab-ios").classList.toggle("on", platform==="ios");
      $("tab-android").classList.toggle("on", platform==="android");
      $("list").innerHTML = list.map((item,i)=>`<li><button type="button" class="${i===step?"on":""}"><span class="num">${i+1}</span><span><strong>${item.title}</strong><em>${item.body}</em></span></button></li>`).join("");
    }
    function go(d) {
      const n = steps().length;
      step = (step + d + n) % n;
      render();
    }
    function tap(el, fn) {
      el.addEventListener("click", (e) => { e.stopPropagation(); fn(); });
    }
    tap($("prev"), () => go(-1));
    tap($("next"), () => go(1));
    tap($("tab-ios"), () => { platform = "ios"; step = 0; render(); });
    tap($("tab-android"), () => { platform = "android"; step = 0; render(); });
    $("list").addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      step = [...$("list").querySelectorAll("button")].indexOf(btn);
      render();
      $("phone").scrollIntoView({ behavior: "smooth", block: "start" });
    });
    let x0=null,y0=null;
    $("phone").addEventListener("pointerdown", e => { x0=e.clientX; y0=e.clientY; });
    $("phone").addEventListener("pointerup", e => {
      if (x0==null) return;
      const dx=e.clientX-x0, dy=e.clientY-y0; x0=y0=null;
      if (Math.abs(dx)<40 || Math.abs(dx)<Math.abs(dy)) return;
      go(dx>0?-1:1);
    });
    if (/Telegram|Instagram|FBAN|FBAV|VKAndroid|VKClient|Line\//i.test(ua)) $("inapp").classList.remove("hidden");
    render();
  </script>
</body>
</html>
