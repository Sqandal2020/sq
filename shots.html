<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SQANDAL — картинки шагов</title>
  <meta name="theme-color" content="#070707" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #070707; color: #fafafa; font-family: Inter, system-ui, sans-serif; }
    .wrap { max-width: 28rem; margin: 0 auto; padding: 1rem 0.75rem 3rem; }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 0.5rem; }
    p { margin: 0 0 1.25rem; color: #8f8f8f; font-size: 0.95rem; line-height: 1.45; }
    figure { margin: 0 0 1.5rem; }
    figcaption { margin: 0.5rem 0 0; font-size: 0.85rem; color: #8f8f8f; }
    img { width: 100%; height: auto; display: block; border-radius: 12px; background: #121212; }
    a.save { display: inline-block; margin-top: 0.4rem; color: #f51d31; font-size: 0.8rem; text-decoration: none; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Картинки шагов</h1>
    <p>Нажмите и удерживайте картинку → «Сохранить в Фото» / «Add to Photos».</p>

    <figure>
      <img src="/steps/1.jpg" alt="Шаг 1. Safari, меню справа от адреса" />
      <figcaption>1. Safari — меню справа от адреса</figcaption>
      <a class="save" href="/steps/1.jpg" download="sqandal-shag-1.jpg">Скачать шаг 1</a>
    </figure>
    <figure>
      <img src="/steps/2.jpg" alt="Шаг 2. Поделиться" />
      <figcaption>2. «Поделиться»</figcaption>
      <a class="save" href="/steps/2.jpg" download="sqandal-shag-2.jpg">Скачать шаг 2</a>
    </figure>
    <figure>
      <img src="/steps/3.jpg" alt="Шаг 3. Показать больше" />
      <figcaption>3. «Показать больше»</figcaption>
      <a class="save" href="/steps/3.jpg" download="sqandal-shag-3.jpg">Скачать шаг 3</a>
    </figure>
    <figure>
      <img src="/steps/4.jpg" alt="Шаг 4. Добавить на экран Домой" />
      <figcaption>4. «Добавить на экран Домой»</figcaption>
      <a class="save" href="/steps/4.jpg" download="sqandal-shag-4.jpg">Скачать шаг 4</a>
    </figure>
    <figure>
      <img src="/steps/5.jpg" alt="Шаг 5. Иконка на главном экране" />
      <figcaption>5. Иконка SQANDAL на экране</figcaption>
      <a class="save" href="/steps/5.jpg" download="sqandal-shag-5.jpg">Скачать шаг 5</a>
    </figure>
  </main>
</body>
</html>
